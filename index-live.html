<!doctype html>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Dashboard runs (live)</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font:15px system-ui}
main{max-width:900px;margin:0 auto;padding:48px 20px}
section{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(16,24,40,.08)}
h1{letter-spacing:-.04em;margin:.2em 0}
.kicker{color:#2563eb;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}
.toolbar{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:8px 12px;border:1px solid #d5dae3;border-radius:8px;font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
button:hover{background:#1d4fd7}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #eef1f6}
a{color:#2563eb;text-decoration:none}
a:hover{text-decoration:underline}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;min-width:86px;text-align:center}
.completed{background:#e5f6ec;color:#137a45}.failed{background:#fdeaea;color:#b02a37}
.running{background:#e8f0fe;color:#1d4fd7}.cancelled,.interrupted{background:#fdf3e0;color:#92610c}
.unknown{background:#eef1f6;color:#555}
.meta{margin-left:auto;font-size:12px;color:#7a8399;white-space:nowrap}
.empty{color:#7a8399;padding:24px 0}
</style>
<main>
  <div class='kicker'>Feature Check</div>
  <h1>Dashboard runs</h1>
  <nav class='nav'>
    <a href='metrics/'>Metrics</a><a href='team-results/'>Team results</a><a href='latest/'>Current job</a>
  </nav>
  <section>
    <div class='toolbar'>
      <input id='q' type='search' placeholder='Filter runs…' autocomplete='off'>
      <button id='refresh' title='Reload now'>↻</button>
      <label style='display:flex;align-items:center;gap:6px;font-size:13px;color:#555'>
        <input type='checkbox' id='live' checked style='accent-color:#2563eb'> live
      </label>
    </div>
    <ul id='runs'><li class='empty'>Loading…</li></ul>
  </section>
</main>
<script>
const list = document.getElementById('runs');
const q = document.getElementById('q');
let rows = [];

// API base: same dir as this page. If the WP plugin is active on another host,
// set window.HFCD_API to e.g. https://wp.example.com/wp-json/hfcd/v1 before loading.
const api = (window.HFCD_API || location.href.replace(/\/[^\/]*$/, '') + '/wp-json/hfcd/v1') ;
// Prefer the REST route when available; fall back to static dashboard.json.
async function fetchRuns() {
  for (const url of [api + '/runs', 'dashboard.json']) {
    try {
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data)) return data;
    } catch (_) {}
  }
  return null;
}

function render() {
  const needle = q.value.trim().toLowerCase();
  const visible = needle ? rows.filter(r => r.run_id.toLowerCase().includes(needle)) : rows;
  if (!visible.length) { list.innerHTML = "<li class='empty'>No matching runs.</li>"; return; }
  list.innerHTML = '';
  for (const r of visible) {
    const li = document.createElement('li');
    const badge = `<span class='badge ${(r.status || 'unknown')}'>${r.status || '?'}</span>`;
    li.innerHTML = `${badge}<a href='${(r.url || ('runs/' + r.run_id + '/'))}'>${r.run_id}</a>`;
    list.appendChild(li);
  }
}

async function refresh() {
  const data = await fetchRuns();
  if (!data) { list.innerHTML = "<li class='empty'>Could not load dashboard.json.</li>"; return; }
  rows = data;
  render();
}

q.addEventListener('input', render);
document.getElementById('refresh').addEventListener('click', refresh);
setInterval(() => { if (document.getElementById('live').checked && !document.hidden) refresh(); }, 15000);
refresh();
</script>
